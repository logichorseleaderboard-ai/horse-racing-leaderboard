<body>

                    <div id="deadHeatInputs">
                        <div class="dead-heat-container"><h4>🏆 第一名 (平頭馬匹)</h4><div id="firstRankInputs"><div class="rank-input-row"><input type="number" class="rank-horse" placeholder="馬號" style="width:60px;"><input type="number" class="rank-div-win" placeholder="獨贏派彩" style="width:100px;"><input type="number" class="rank-div-place" placeholder="位置派彩" style="width:100px;"><button type="button" class="remove-rank-btn" style="width:30px; background:#ef4444; padding:4px;">✕</button></div></div><button type="button" class="add-rank-btn" data-rank="first">➕ 新增平頭馬</button></div>
                        <div class="dead-heat-container" style="border-left-color:#94a3b8;"><h4>🥈 第二名 (平頭馬匹)</h4><div id="secondRankInputs"><div class="rank-input-row"><input type="number" class="rank-horse" placeholder="馬號" style="width:60px;"><input type="number" class="rank-div-place" placeholder="位置派彩" style="width:100px;"><button type="button" class="remove-rank-btn" style="width:30px; background:#ef4444; padding:4px;">✕</button></div></div><button type="button" class="add-rank-btn" data-rank="second">➕ 新增平頭馬</button></div>
                        <div class="dead-heat-container" style="border-left-color:#b45309;"><h4>🥉 第三名 (平頭馬匹)</h4><div id="thirdRankInputs"><div class="rank-input-row"><input type="number" class="rank-horse" placeholder="馬號" style="width:60px;"><input type="number" class="rank-div-place" placeholder="位置派彩" style="width:100px;"><button type="button" class="remove-rank-btn" style="width:30px; background:#ef4444; padding:4px;">✕</button></div></div><button type="button" class="add-rank-btn" data-rank="third">➕ 新增平頭馬</button></div>
                    </div>
                    <!-- 連贏/位置Q 派彩矩陣 -->
                    <div id="deadHeatMatrix" style="margin-top:15px;"></div>
                    <button onclick="saveRaceResult()" style="margin-top:16px;">💾 儲存並自動結算</button>
                    <div id="deadHeatSummary" class="dead-heat-summary" style="display:none;"></div>
                </div>
            </div>
        </div>
    </div>

<script>
    // ========== Supabase 初始化 ==========
    const SUPABASE_URL = "https://dmgauesvjpelufjrnlzf.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRtZ2F1ZXN2anBlbHVmanJubHpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyOTE5MTAsImV4cCI6MjA5Mjg2NzkxMH0.IHezXCywHMpKW7t6V9wAXVab-9j8O5Rg2uRu2WvLzk4";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    // ========== 全域變數 ==========
    let participants = [], raceDays = [], currentRaceDate = null, adminUnlocked = false, resultUnlocked = false, betUnlocked = false;
    let countdownInterval = null;
    let currentCutoffTime = '12:15:00';
    let serverHKTime = null;
    let lastSyncTime = 0;
    
    // ========== 外部 API 函數 ==========
    async function fetchHorsesFromAPI(raceDate, raceNo) {
        try {
            const url = `https://racing.stheadline.com/api/raceEntry?raceNo=${raceNo}&date=${raceDate}&rev=2`;
            const response = await fetch(url);
            const result = await response.json();
            if (result.success && result.data && result.data.raceEntries) {
                return result.data.raceEntries.map(entry => ({
                    horseNo: entry.horseNo,
                    horseName: entry.horse?.name || entry.horse?.nameSc || `馬匹 ${entry.horseNo}`,
                    horseNameEn: entry.horse?.nameEn || '',
                    jockey: entry.jockey?.name || '',
                    trainer: entry.trainer?.name || '',
                    rating: entry.rating || 0,
                    weight: entry.handicapWeight || 0
                }));
            }
            return [];
        } catch (error) {
            console.error("讀取馬匹資料失敗:", error);
            return [];
        }
    }
    
    async function fetchRaceCount(raceDate) {
        for (let i = 1; i <= 11; i++) {
            try {
                const url = `https://racing.stheadline.com/api/raceEntry?raceNo=${i}&date=${raceDate}&rev=2`;
                const response = await fetch(url);
                const result = await response.json();
                if (!result.success || !result.data || !result.data.raceEntries || result.data.raceEntries.length === 0) {
                    return i - 1;
                }
            } catch (e) {
                return i - 1;
            }
        }
        return 11;
    }
    
    // ========== 計時器函數（完整版） ==========
    async function fetchServerHKTime() {
        try {
            const { data: timeData, error: timeError } = await supabaseClient.rpc('get_server_time');
            if (timeError) throw timeError;
            if (timeData) {
                const serverTime = new Date(timeData);
                console.log("伺服器時間:", serverTime.toLocaleString());
                return serverTime;
            }
            throw new Error('無法從伺服器獲取時間');
        } catch (error) {
            console.error("獲取伺服器時間失敗:", error);
            return null;
        }
    }
    
    async function syncServerTime() {
        const serverTime = await fetchServerHKTime();
        if (serverTime) {
            serverHKTime = serverTime;
            lastSyncTime = Date.now();
            console.log("✅ 伺服器時間同步成功:", serverHKTime.toLocaleString());
            return true;
        }
        return false;
    }
    
    function getHKTime() {
        if (serverHKTime) {
            const elapsed = Date.now() - lastSyncTime;
            return new Date(serverHKTime.getTime() + elapsed);
        }
        const fallback = new Date();
        console.warn("⚠️ 使用備用時間（裝置時間）");
        return fallback;
    }
    
    async function loadCutoffTime() {
        try {
            const { data, error } = await supabaseClient.from('system_settings').select('value').eq('key', 'cutoff_time').single();
            if (!error && data) {
                currentCutoffTime = data.value;
                const timeInput = document.getElementById('cutoffTime');
                if (timeInput) timeInput.value = currentCutoffTime;
                const statusDiv = document.getElementById('cutoffTimeStatus');
                if (statusDiv) statusDiv.innerHTML = '✅ 目前封盤時間: ' + currentCutoffTime;
            } else {
                const statusDiv = document.getElementById('cutoffTimeStatus');
                if (statusDiv) statusDiv.innerHTML = '⚠️ 使用預設封盤時間: 17:00:00';
            }
        } catch (e) {
            console.error("載入封盤時間失敗:", e);
        }
    }
    
    async function saveCutoffTime() {
        const newTime = document.getElementById('cutoffTime')?.value;
        if (!newTime) return alert("請輸入時間");
        const { error } = await supabaseClient.from('system_settings').upsert({ key: 'cutoff_time', value: newTime }, { onConflict: 'key' });
        if (error) {
            alert("儲存失敗: " + error.message);
        } else {
            currentCutoffTime = newTime;
            alert("✅ 封盤時間已更新");
            const statusDiv = document.getElementById('cutoffTimeStatus');
            if (statusDiv) statusDiv.innerHTML = '✅ 目前封盤時間: ' + currentCutoffTime;
            updateCountdownDisplay();
        }
    }
    
    function getSecondsUntilCutoff(raceDate, cutoffTimeStr) {
        if (!raceDate || !cutoffTimeStr) return -1;
        const cutoffDateTime = new Date(`${raceDate}T${cutoffTimeStr}+08:00`);
        const hkNow = getHKTime();
        if (cutoffDateTime <= hkNow) return 0;
        return Math.floor((cutoffDateTime - hkNow) / 1000);
    }
    
    function formatCountdown(seconds) {
        if (seconds <= 0) return "已封盤";
        const hours = Math.floor(seconds / 3600);
        const minutes = Math.floor((seconds % 3600) / 60);
        const secs = seconds % 60;
        if (hours > 0) return `${hours}小時 ${minutes}分鐘 ${secs}秒`;
        else if (minutes > 0) return `${minutes}分鐘 ${secs}秒`;
        else return `${secs}秒`;
    }
    
    function updateCountdownDisplay() {
        const raceDate = document.getElementById('inputRaceDate')?.value;
        const countdownEl = document.getElementById('countdownDisplay');
        const submitBtn = document.getElementById('submitBtn');
        const lockMsg = document.getElementById('inputLockMsg');
        if (!raceDate) { if (countdownEl) countdownEl.innerHTML = '請選擇賽日'; return; }
        const secondsLeft = getSecondsUntilCutoff(raceDate, currentCutoffTime);
        if (countdownEl) {
            countdownEl.innerHTML = formatCountdown(secondsLeft);
            if (secondsLeft <= 60 && secondsLeft > 0) { countdownEl.style.color = '#ef4444'; countdownEl.style.fontWeight = 'bold'; } 
            else { countdownEl.style.color = ''; }
        }
        if (secondsLeft <= 0) {
            if (submitBtn) submitBtn.disabled = true;
            if (lockMsg) { lockMsg.style.display = 'block'; lockMsg.innerHTML = `🔒 已封盤 (賽日 ${raceDate} ${currentCutoffTime} 截止)`; }
        } else {
            if (submitBtn) submitBtn.disabled = false;
            if (lockMsg) lockMsg.style.display = 'none';
        }
    }
    
    function startCountdown() {
        if (countdownInterval) clearInterval(countdownInterval);
        syncServerTime().then(() => { updateCountdownDisplay(); });
        countdownInterval = setInterval(() => { updateCountdownDisplay(); }, 1000);
        setInterval(async () => { await syncServerTime(); console.log("🔄 自動同步伺服器時間完成"); }, 60000);
    }
    
    async function initCountdown() {
        await syncServerTime();
        startCountdown();
    }
    
    // ========== 投注相關函數 ==========
    async function initHorseSelects() {
        if (!currentRaceDate) return;
        const raceNo = parseInt(document.getElementById('inputRaceNo').value);
        if (isNaN(raceNo)) return;
        const horses = await fetchHorsesFromAPI(currentRaceDate, raceNo);
        const sortedHorses = [...horses].sort((a, b) => a.horseNo - b.horseNo);
        const opts = '<option value="">-- 請選擇 --</option>' + sortedHorses.map(h => `<option value="${h.horseNo}">${h.horseNo}號 - ${h.horseName}</option>`).join('');
        ['horse1', 'horse2', 'horse3', 'bankerHorseSelect'].forEach(id => { const el = document.getElementById(id); if (el) el.innerHTML = opts; });
    }
    
    function getSelectedHorses() {
        let horses = [];
        let h1 = document.getElementById('horse1').value;
        let h2 = document.getElementById('horse2').value;
        let h3 = document.getElementById('horse3').value;
        if (h1) horses.push(parseInt(h1));
        if (h2) horses.push(parseInt(h2));
        if (h3) horses.push(parseInt(h3));
        return [...new Set(horses)];
    }
    
    function updateBankerSelect() {
        const horses = getSelectedHorses();
        const bankerSelect = document.getElementById('bankerHorseSelect');
        const currentVal = bankerSelect.value;
        bankerSelect.innerHTML = '<option value="">-- 請選擇 --</option>';
        horses.forEach(h => { bankerSelect.innerHTML += `<option value="${h}">${h} 號</option>`; });
        if (currentVal && horses.includes(parseInt(currentVal))) bankerSelect.value = currentVal;
        else bankerSelect.value = '';
    }
    
    function getComboMultiplier() {
        const horses = getSelectedHorses();
        const count = horses.length;
        if (count < 2) return 0;
        const comboType = document.querySelector('input[name="comboType"]:checked')?.value;
        const bankerVal = comboType === 'banker' ? parseInt(document.getElementById('bankerHorseSelect').value) : null;
        if (comboType === 'all') return count * (count - 1) / 2;
        else if (comboType === 'banker' && bankerVal && horses.includes(bankerVal)) return count - 1;
        return 0;
    }
    
    function updateMultiplierDisplay() {
        const multiplier = getComboMultiplier();
        const displayText = multiplier > 0 ? `組合倍數: ${multiplier} 倍 (輸入1組 = ${multiplier}注)` : '組合倍數: -';
        document.getElementById('quinellaMultiplier').innerText = displayText;
        document.getElementById('quinellaPlaceMultiplier').innerText = displayText;
        validateTotalUnits();
    }
    
    function calculateActualTotalUnits() {
        const horses = getSelectedHorses();
        const horseCount = horses.length;
        const comboType = document.querySelector('input[name="comboType"]:checked')?.value;
        const bankerVal = comboType === 'banker' ? parseInt(document.getElementById('bankerHorseSelect').value) : null;
        let win = parseInt(document.getElementById('winUnits').value) || 0;
        let place = parseInt(document.getElementById('placeUnits').value) || 0;
        let quinellaGroups = parseInt(document.getElementById('quinellaUnits').value) || 0;
        let quinellaPlaceGroups = parseInt(document.getElementById('quinellaPlaceUnits').value) || 0;
        const multiplier = getComboMultiplier();
        let winActual = 0, placeActual = 0;
        if (horseCount === 1) { winActual = win; placeActual = place; }
        else if (comboType === 'banker' && bankerVal && horses.includes(bankerVal)) { winActual = win; placeActual = place; }
        else { winActual = win * horseCount; placeActual = place * horseCount; }
        let quinellaActual = quinellaGroups * multiplier;
        let quinellaPlaceActual = quinellaPlaceGroups * multiplier;
        return winActual + placeActual + quinellaActual + quinellaPlaceActual;
    }
    
    function validateTotalUnits() {
        const total = calculateActualTotalUnits();
        const errorSpan = document.getElementById('totalUnitsError');
        const horses = getSelectedHorses();
        const horseCount = horses.length;
        const comboType = document.querySelector('input[name="comboType"]:checked')?.value;
        if (total !== 12) {
            if (horseCount > 1 && comboType === 'all') errorSpan.innerText = `總注數必須為 12 注 (目前 ${total} 注)。注意：互串模式下，獨贏/位置注數會自動乘以 ${horseCount} 匹馬。`;
            else if (horseCount > 1 && comboType === 'banker') errorSpan.innerText = `總注數必須為 12 注 (目前 ${total} 注)。注意：膽拖模式下，獨贏/位置只投膽馬。`;
            else errorSpan.innerText = `總注數必須為 12 注 (目前 ${total} 注)，總金額需為 $120。`;
            return false;
        } else { errorSpan.innerText = ''; return true; }
    }
    
    function bindBetFormEvents() {
        const horseSelects = ['horse1', 'horse2', 'horse3'];
        horseSelects.forEach(id => {
            document.getElementById(id).addEventListener('change', () => {
                const horses = getSelectedHorses();
                const count = horses.length;
                const warning = document.getElementById('horsesCountWarning');
                const comboDiv = document.getElementById('comboOptions');
                const quinellaGroup = document.getElementById('quinellaGroup');
                const quinellaPlaceGroup = document.getElementById('quinellaPlaceGroup');
                if (count === 0) { comboDiv.style.display = 'none'; quinellaGroup.style.display = 'none'; quinellaPlaceGroup.style.display = 'none'; warning.innerText = ''; }
                else if (count === 1) { comboDiv.style.display = 'none'; quinellaGroup.style.display = 'none'; quinellaPlaceGroup.style.display = 'none'; warning.innerText = '⚠️ 只選1匹馬，僅能投注獨贏／位置。'; }
                else { comboDiv.style.display = 'block'; quinellaGroup.style.display = 'block'; quinellaPlaceGroup.style.display = 'block'; warning.innerText = ''; }
                updateBankerSelect(); updateMultiplierDisplay();
            });
        });
        document.querySelectorAll('input[name="comboType"]').forEach(radio => {
            radio.addEventListener('change', () => {
                const comboType = document.querySelector('input[name="comboType"]:checked')?.value;
                const bankerDiv = document.getElementById('bankerSelectDiv');
                bankerDiv.style.display = (comboType === 'banker') ? 'block' : 'none';
                updateMultiplierDisplay(); validateTotalUnits();
            });
        });
        document.getElementById('bankerHorseSelect').addEventListener('change', updateMultiplierDisplay);
        ['winUnits', 'placeUnits', 'quinellaUnits', 'quinellaPlaceUnits'].forEach(id => {
            document.getElementById(id).addEventListener('input', validateTotalUnits);
        });
    }
    
    // ========== 載入賽日相關下拉選單 ==========
    async function loadRaceDaysForResult() {
        const { data, error } = await supabaseClient.from('race_days').select('race_date').order('race_date', { ascending: true });
        if (error) return;
        const select = document.getElementById('resultRaceDate');
        if (!select) return;
        const today = new Date().toISOString().slice(0,10);
        let nextRace = null;
        for (let d of data) { if (d.race_date >= today) { nextRace = d.race_date; break; } }
        if (!nextRace && data.length > 0) nextRace = data[data.length - 1].race_date;
        select.innerHTML = data.map(d => `<option value="${d.race_date}">${d.race_date}</option>`).join('');
        if (nextRace) select.value = nextRace;
    }
    
    async function loadRaceDaysForSettle() {
        const { data, error } = await supabaseClient.from('race_days').select('race_date').order('race_date', { ascending: false });
        if (error) return;
        const select = document.getElementById('settleRaceDate');
        if (select) select.innerHTML = '<option value="">-- 請選擇 --</option>' + data.map(d => `<option value="${d.race_date}">${d.race_date}</option>`).join('');
    }
    
    async function loadRaceDaysForDetail() {
        const { data, error } = await supabaseClient.from('race_days').select('race_date').order('race_date', { ascending: true });
        if (error) return;
        const select = document.getElementById('detailRaceDate');
        if (!select) return;
        const today = new Date().toISOString().slice(0,10);
        let nextRace = null;
        for (let d of data) { if (d.race_date >= today) { nextRace = d.race_date; break; } }
        if (!nextRace && data.length > 0) nextRace = data[0].race_date;
        select.innerHTML = '<option value="all">全部賽日</option>' + data.map(d => `<option value="${d.race_date}">${d.race_date}</option>`).join('');
        if (nextRace) select.value = nextRace;
    }
    
    async function loadParticipants() {
        const { data, error } = await supabaseClient.from('participants').select('*').order('name');
        if (!error) participants = data || [];
        const opt = participants.map(p => `<option value="${p.name}">${p.name}</option>`).join('');
        document.getElementById('inputUserSelect').innerHTML = '<option value="">-- 請選擇 --</option>' + opt;
        document.getElementById('statsUserSelect').innerHTML = '<option value="">-- 請選擇 --</option>' + opt;
        document.getElementById('detailUserSelect').innerHTML = '<option value="all">全部參賽者</option>' + opt;
        document.getElementById('participantList').innerHTML = participants.map(p => `<span class="badge">${p.name} <b onclick="deleteParticipant(${p.id})" style="cursor:pointer;color:red;">✖</b></span>`).join(' ');
    }
    
    async function loadRaceDays() {
        const { data, error } = await supabaseClient.from('race_days').select('*').order('race_date', { ascending: true });
        if (!error) raceDays = data || [];
        const today = new Date().toISOString().slice(0,10);
        const nextRace = raceDays.find(d => d.race_date >= today) || raceDays[0];
        currentRaceDate = nextRace ? nextRace.race_date : null;
        if (currentRaceDate) document.getElementById('inputRaceDate').value = currentRaceDate;
        document.getElementById('raceDayList').innerHTML = raceDays.map(d => `<span class="badge">${d.race_date} <b onclick="deleteRaceDay(${d.id})" style="cursor:pointer;color:red;">✖</b></span>`).join(' ');
        await loadRaceDaysForResult(); await loadRaceDaysForSettle(); await loadRaceDaysForDetail(); await initRaceNoSelects();
        updateCountdownDisplay();
    }
    
    async function initRaceNoSelects() {
        if (!currentRaceDate) return;
        const raceCount = await fetchRaceCount(currentRaceDate);
        const opts = Array.from({length: raceCount}, (_,i) => `<option value="${i+1}">第 ${i+1} 場</option>`).join('');
        const rankButtonsContainer = document.getElementById('rankRaceButtons');
        if (rankButtonsContainer) {
            const buttonsHtml = Array.from({length: raceCount}, (_, i) => { const raceNum = i + 1; return `<button class="race-btn" data-race="${raceNum}">${raceNum}</button>`; }).join('');
            rankButtonsContainer.innerHTML = buttonsHtml;
            document.querySelectorAll('.race-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.race-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    loadRankingChart();
                });
            });
            const firstBtn = document.querySelector('.race-btn');
            if (firstBtn) firstBtn.classList.add('active');
        }
        const inputSelect = document.getElementById('inputRaceNo');
        if (inputSelect) inputSelect.innerHTML = '<option value="all">全部場次</option>' + opts;
        const resultSelect = document.getElementById('resultRaceNo');
        if (resultSelect) resultSelect.innerHTML = opts;
        const detailSelect = document.getElementById('detailRaceNo');
        if (detailSelect) detailSelect.innerHTML = '<option value="all">全部場次</option>' + opts;
        if (detailSelect) detailSelect.value = 'all';
    }
    
    // ========== 排位熱度圖 ==========
    async function loadRankingChart() {
        if (!currentRaceDate) { document.getElementById('rankChart').innerHTML = '<div class="card">請先選擇賽日</div>'; return; }
        const activeBtn = document.querySelector('.race-btn.active');
        if (!activeBtn) { document.getElementById('rankChart').innerHTML = '<div class="card">請選擇場次</div>'; return; }
        const raceNo = activeBtn.getAttribute('data-race');
        if (!raceNo) return;
        document.getElementById('rankChart').innerHTML = '<div class="card">載入排位資料...</div>';
        const horses = await fetchHorsesFromAPI(currentRaceDate, raceNo);
        const { data: bets } = await supabaseClient.from('bets').select('flexible_data, banker, legs').eq('race_date', currentRaceDate).eq('race_no', raceNo);
        let bankerCnt = {}, legCnt = {};
        (bets || []).forEach(b => {

                    else if (comboType === 'all' && horseList.length >= 2) legs = horseList;

        });
        let maxCnt = 0;

        }
        html += `<div style="display: flex; justify-content: center; gap: 24px; margin-top: 16px; padding-top: 8px; border-top: 1px solid #e2e8f0;"><span style="display: inline-flex; align-items: center; gap: 6px;"><span style="display: inline-block; width: 14px; height: 14px; background: #ef4444; border-radius: 3px;"></span><span style="font-size: 0.75rem;">膽</span></span><span style="display: inline-flex; align-items: center; gap: 6px;"><span style="display: inline-block; width: 14px; height: 14px; background: #22c55e; border-radius: 3px;"></span><span style="font-size: 0.75rem;">腳</span></span></div>`;

    // ========== 核心：更新連贏/位置Q派彩矩陣 ==========
    function updateDeadHeatMatrix() {
        const firstData = collectRankData('first');
        const secondData = collectRankData('second');
        const thirdData = collectRankData('third');
        const allHorses = [...firstData, ...secondData, ...thirdData];
        if (allHorses.length < 2) {
            document.getElementById('deadHeatMatrix').innerHTML = '<div class="info-note">請輸入至少兩匹入圍馬匹，以顯示連贏/位置Q派彩矩陣</div>';
            document.getElementById('deadHeatSummary').style.display = 'none';
            return;
        }
        let html = '<h3 style="margin:15px 0 8px;">連贏 / 位置Q 派彩矩陣 (每$10)</h3><div class="matrix-grid">';
        for (let i = 0; i < allHorses.length; i++) {
            for (let j = i+1; j < allHorses.length; j++) {
                const h1 = allHorses[i]; const h2 = allHorses[j];
                const pairKey = `${h1.horse}-${h2.horse}`;
                html += `<div class="matrix-cell"><div><strong>${h1.horse} & ${h2.horse}</strong></div><div style="display:flex; gap:4px; margin-top:4px;"><input type="number" class="matrix-q-div" data-pair="${pairKey}" placeholder="連贏" style="width:50%;"><input type="number" class="matrix-qp-div" data-pair="${pairKey}" placeholder="位置Q" style="width:50%;"></div></div>`;
            }
        }
        html += '</div>';
        document.getElementById('deadHeatMatrix').innerHTML = html;
        const summary = document.getElementById('deadHeatSummary');
        summary.style.display = 'block';
        summary.innerHTML = `<strong>📋 賽果摘要</strong><br>🏆 第一名: ${firstData.map(d => `${d.horse}號 (獨贏${d.winDiv||0} 位置${d.placeDiv||0})`).join('、') || '無'}<br>🥈 第二名: ${secondData.map(d => `${d.horse}號 (位置${d.placeDiv||0})`).join('、') || '無'}<br>🥉 第三名: ${thirdData.map(d => `${d.horse}號 (位置${d.placeDiv||0})`).join('、') || '無'}<br><span style="color:#64748b;">💡 請為每個組合輸入連贏及位置Q派彩</span>`;
    }
    
    // ========== 核心：收集平頭馬匹數據 ==========
    function collectRankData(rank) {
        const containerId = rank + 'RankInputs';
        const container = document.getElementById(containerId);
        if (!container) return [];
        const rows = container.querySelectorAll('.rank-input-row');
        const result = [];
        rows.forEach(row => {
            const horse = parseInt(row.querySelector('.rank-horse')?.value);
            if (isNaN(horse)) return;
            if (rank === 'first') {
                const winDiv = parseFloat(row.querySelector('.rank-div-win')?.value) || 0;
                const placeDiv = parseFloat(row.querySelector('.rank-div-place')?.value) || 0;
                result.push({ horse, winDiv, placeDiv });
            } else {
                const placeDiv = parseFloat(row.querySelector('.rank-div-place')?.value) || 0;
                result.push({ horse, placeDiv });
            }
        });
        return result;
    }
    
    // ========== 核心：儲存賽果（平頭矩陣版）==========
    async function saveRaceResult() {
        const raceDate = document.getElementById('resultRaceDate').value;
        if (!raceDate) { alert("請選擇賽日"); return; }
        const raceNoSelect = document.getElementById('resultRaceNo');
        const raceNoValue = raceNoSelect.value;
        if (raceNoValue === 'all' || raceNoValue === '') { alert("請選擇具體場次（不能為「全部場次」）"); return; }
        const raceNo = parseInt(raceNoValue);
        if (isNaN(raceNo)) { alert("請選擇有效場次"); return; }
        const firstData = collectRankData('first');
        const secondData = collectRankData('second');
        const thirdData = collectRankData('third');
        if (firstData.length === 0) { alert("請輸入至少一匹第一名馬匹"); return; }
        const firstSet = new Set(firstData.map(d => d.horse));
        const secondSet = new Set(secondData.map(d => d.horse));
        const thirdSet = new Set(thirdData.map(d => d.horse));
        const allPlaced = [...firstSet, ...secondSet, ...thirdSet];
        const winDivMap = {};
        const placeDivMap = {};
        firstData.forEach(d => { winDivMap[d.horse] = d.winDiv; placeDivMap[d.horse] = d.placeDiv; });
        secondData.forEach(d => { placeDivMap[d.horse] = d.placeDiv; });
        thirdData.forEach(d => { placeDivMap[d.horse] = d.placeDiv; });
        const scratchedRaw = document.getElementById('scratchedHorses').value.trim();
        const scratchedHorses = scratchedRaw ? scratchedRaw.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n)) : [];
        const scratchedSet = new Set(scratchedHorses);
        
        // 讀取矩陣派彩
        const matrixData = {};
        document.querySelectorAll('.matrix-q-div').forEach(inp => {
            const pair = inp.dataset.pair; if (!matrixData[pair]) matrixData[pair] = { q: 0, qp: 0 };
            matrixData[pair].q = parseFloat(inp.value) || 0;
        });
        document.querySelectorAll('.matrix-qp-div').forEach(inp => {
            const pair = inp.dataset.pair; if (!matrixData[pair]) matrixData[pair] = { q: 0, qp: 0 };
            matrixData[pair].qp = parseFloat(inp.value) || 0;
        });
        
        const { error: resError } = await supabaseClient.from('race_results').upsert({
            race_date: raceDate, race_no: raceNo,
            first_data: firstData, second_data: secondData, third_data: thirdData,
            first_list: firstData.map(d => d.horse), second_list: secondData.map(d => d.horse), third_list: thirdData.map(d => d.horse),
            win_div_map: winDivMap, place_div_map: placeDivMap, matrix_data: matrixData,
            scratched: scratchedRaw
        }, { onConflict: 'race_date, race_no' });
        if (resError) { alert("賽果儲存失敗: " + resError.message); return; }
        
        const { data: bets, error: betsError } = await supabaseClient.from('bets').select('*').eq('race_date', raceDate).eq('race_no', raceNo);
        if (betsError) { alert("讀取投注失敗: " + betsError.message); return; }
        if (bets.length === 0) { alert("該場次沒有投注紀錄"); return; }
        
        for (let bet of bets) {
            let grossPayout = 0, refund = false, refundAmount = 0, amount = bet.amount || 120;
            let updatedFlexibleData = bet.flexible_data ? { ...bet.flexible_data } : null;
            if (bet.flexible_data && bet.flexible_data.auto_deduct) { grossPayout = 0; }
            else if (bet.flexible_data && bet.flexible_data.units) {
                const fd = bet.flexible_data; const units = fd.units || {}; const banker = fd.banker ? parseInt(fd.banker) : null; const legs = fd.horses ? fd.horses.split(',').map(Number) : []; const comboType = fd.comboType;
                let totalRefundUnits = 0;
                // 獨贏
                const winUnits = units.win || 0;
                if (winUnits > 0) {
                    if (comboType === 'banker' && banker !== null) {
                        if (scratchedSet.has(banker)) { totalRefundUnits += winUnits; } else if (firstSet.has(banker)) { grossPayout += winUnits * (winDivMap[banker] || 0); }
                    } else {
                        for (let horse of legs) {
                            if (scratchedSet.has(horse)) { totalRefundUnits += winUnits; } else if (firstSet.has(horse)) { grossPayout += winUnits * (winDivMap[horse] || 0); }
                        }
                    }
                }
                // 位置
                const placeUnits = units.place || 0;
                if (placeUnits > 0) {
                    if (comboType === 'banker' && banker !== null) {
                        if (scratchedSet.has(banker)) { totalRefundUnits += placeUnits; } else if (firstSet.has(banker)) { grossPayout += placeUnits * (placeDivMap[banker] || 0); } else if (secondSet.has(banker)) { grossPayout += placeUnits * (placeDivMap[banker] || 0); } else if (thirdSet.has(banker)) { grossPayout += placeUnits * (placeDivMap[banker] || 0); }
                    } else {
                        for (let horse of legs) {
                            if (scratchedSet.has(horse)) { totalRefundUnits += placeUnits; } else if (firstSet.has(horse)) { grossPayout += placeUnits * (placeDivMap[horse] || 0); } else if (secondSet.has(horse)) { grossPayout += placeUnits * (placeDivMap[horse] || 0); } else if (thirdSet.has(horse)) { grossPayout += placeUnits * (placeDivMap[horse] || 0); }
                        }
                    }
                }
                // 連贏
                const quinellaGroups = units.quinella || 0;
                if (quinellaGroups > 0) {
                    let quinellaCombos = [];
                    if (comboType === 'all') { for (let i = 0; i < legs.length; i++) { for (let j = i+1; j < legs.length; j++) { quinellaCombos.push([legs[i], legs[j]]); } } }
                    else if (comboType === 'banker' && banker !== null) { for (let leg of legs) { if (leg !== banker) quinellaCombos.push([banker, leg]); } }
                    for (let combo of quinellaCombos) {
                        const [a, b] = combo;
                        if (scratchedSet.has(a) || scratchedSet.has(b)) { totalRefundUnits += quinellaGroups; }
                        else {
                            const pairKey = `${Math.min(a,b)}-${Math.max(a,b)}`;
                            const qDiv = matrixData[pairKey]?.q || 0;
                            if (qDiv > 0 && ((firstSet.has(a) && secondSet.has(b)) || (firstSet.has(b) && secondSet.has(a)))) { grossPayout += quinellaGroups * qDiv; }
                        }
                    }
                }
                // 位置Q
                const qpGroups = units.quinellaPlace || 0;
                if (qpGroups > 0) {
                    let qpCombos = [];
                    if (comboType === 'all') { for (let i = 0; i < legs.length; i++) { for (let j = i+1; j < legs.length; j++) { qpCombos.push([legs[i], legs[j]]); } } }
                    else if (comboType === 'banker' && banker !== null) { for (let leg of legs) { if (leg !== banker) qpCombos.push([banker, leg]); } }
                    for (let combo of qpCombos) {
                        const [a, b] = combo;
                        if (scratchedSet.has(a) || scratchedSet.has(b)) { totalRefundUnits += qpGroups; }
                        else {
                            const pairKey = `${Math.min(a,b)}-${Math.max(a,b)}`;
                            const qpDiv = matrixData[pairKey]?.qp || 0;
                            if (qpDiv > 0 && allPlaced.includes(a) && allPlaced.includes(b)) { grossPayout += qpGroups * qpDiv; }
                        }
                    }
                }
                refundAmount = totalRefundUnits * 10;
                if (refundAmount > 0) {
                    refund = true;
                    const originalAmount = 120;
                    amount = originalAmount - refundAmount;
                    if (amount < 0) amount = 0;
                    if (updatedFlexibleData) { updatedFlexibleData.refundAmount = refundAmount; updatedFlexibleData.refundUnits = totalRefundUnits; updatedFlexibleData.scratchedLegs = scratchedHorses; }
                }
            }
            else if (bet.banker && bet.banker !== '' && bet.legs) {
                const banker = parseInt(bet.banker); const legs = bet.legs.split(',').map(Number); const leg1 = legs[0], leg2 = legs[1];
                if (scratchedSet.has(banker)) { refund = true; refundAmount = amount; amount = 0; grossPayout = 0; }
                else {
                    let refundUnits = 0;
                    if (firstSet.has(banker)) { grossPayout += (winDivMap[banker] || 0) + ((placeDivMap[banker] || 0) * 3); } else if (secondSet.has(banker)) { grossPayout += (placeDivMap[banker] || 0) * 3; } else if (thirdSet.has(banker)) { grossPayout += (placeDivMap[banker] || 0) * 3; }
                    const pairKey1 = `${Math.min(banker, leg1)}-${Math.max(banker, leg1)}`; const pairKey2 = `${Math.min(banker, leg2)}-${Math.max(banker, leg2)}`;
                    if (!scratchedSet.has(leg1) && ((firstSet.has(banker) && secondSet.has(leg1)) || (secondSet.has(banker) && firstSet.has(leg1)))) { grossPayout += matrixData[pairKey1]?.q || 0; } else if (scratchedSet.has(leg1)) { refundUnits++; }
                    if (!scratchedSet.has(leg2) && ((firstSet.has(banker) && secondSet.has(leg2)) || (secondSet.has(banker) && firstSet.has(leg2)))) { grossPayout += matrixData[pairKey2]?.q || 0; } else if (scratchedSet.has(leg2)) { refundUnits++; }
                    const pairs = [[banker, leg1], [banker, leg2]];
                    for (let i = 0; i < pairs.length; i++) {
                        const pair = pairs[i]; const legScratched = (i === 0) ? scratchedSet.has(leg1) : scratchedSet.has(leg2);
                        if (legScratched) continue;
                        const [a, b] = pair;
                        if (allPlaced.includes(a) && allPlaced.includes(b)) {
                            const key = `${Math.min(a,b)}-${Math.max(a,b)}`;
                            grossPayout += matrixData[key]?.qp || 0;
                        }
                    }
                    refundAmount = refundUnits * 10; if (refundAmount > 0) refund = true;
                }
            }
            const netProfit = grossPayout - amount;
            const updateData = { payout: netProfit, amount: amount, refund: refund, refund_amount: refundAmount };
            if (updatedFlexibleData) { updateData.flexible_data = updatedFlexibleData; }
            await supabaseClient.from('bets').update(updateData).eq('id', bet.id);
        }
        alert(`✅ 第 ${raceNo} 場結算完成！共更新 ${bets.length} 筆投注。${scratchedHorses.length > 0 ? `退賽馬匹: ${scratchedHorses.join(',')}` : ''}`);
        loadRankingChart(); if (document.getElementById('detail-page').classList.contains('active-page')) loadUserBets(); loadMonthlyRanking(); if (document.getElementById('stats-page').classList.contains('active-page')) loadStatsForCurrentUser();
    }

        document.getElementById('autoDeductBtn')?.addEventListener('click', autoDeductForNonBetting);
        document.getElementById('saveCutoffTimeBtn')?.addEventListener('click', saveCutoffTime);
        document.getElementById('inputRaceNo')?.addEventListener('change', async () => { await initHorseSelects(); document.getElementById('horse1').value = ''; document.getElementById('horse2').value = ''; document.getElementById('horse3').value = ''; });
        document.getElementById('rankRaceNo')?.addEventListener('change', loadRankingChart);
    };
</script>
</body>
